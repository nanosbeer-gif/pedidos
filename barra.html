// ===== Timbre fuerte: <audio> con WAV generado (suena aunque el iPhone esté en silencio) =====
function makeChime(){
  const sr = 22050, notes = [988, 1319, 1568, 1319, 1568, 2093], dur = 0.22, gap = 0.04, reps = 3, pause = 0.35;
  const one = notes.length*(dur+gap), total = reps*one + (reps-1)*pause;
  const n = Math.floor(total*sr), data = new Int16Array(n);
  for(let r=0;r<reps;r++){
    const off = r*(one+pause);
    notes.forEach((f,k)=>{
      const st = Math.floor((off + k*(dur+gap))*sr), len = Math.floor(dur*sr);
      for(let i=0;i<len && st+i<n;i++){
        const t = i/sr, env = Math.min(1, i/200) * Math.exp(-3*t);
        const v = Math.sin(2*Math.PI*f*t) + 0.5*Math.sin(2*Math.PI*2*f*t) + 0.25*Math.sign(Math.sin(2*Math.PI*f*t));
        data[st+i] = Math.max(-32767, Math.min(32767, v*env*20000));
      }
    });
  }
  const buf = new ArrayBuffer(44 + n*2), dv = new DataView(buf);
  const w = (o,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(o+i, s.charCodeAt(i)); };
  w(0,"RIFF"); dv.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); dv.setUint32(16,16,true);

  new Int16Array(buf,44).set(data);
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
}
const chime = new Audio(makeChime()); chime.preload = "auto";
let chimeReady = false;
try{ if(navigator.audioSession) navigator.audioSession.type = "playback"; }catch{}
// Llamar dentro de un toque del usuario para que el navegador permita sonar después
function unlockSound(){

async function buscarHist(desde, hasta){
  const a = new Date(desde+"T00:00:00"), b = new Date(hasta+"T00:00:00"); b.setDate(b.getDate()+1);
  hist = {desde, hasta, docs:null, descargado:false, confirmar:false, msg:""}; render();
  $("#hsRes").innerHTML = `<p class="hint">Buscando…</p>`;
  try{
    const snap = await getDocs(query(collection(db,"pedidos"), where("creado",">=",Timestamp.fromDate(a)), where("creado","<",Timestamp.fromDate(b))));
    hist.docs = snap.docs.map(d=>({id:d.id, data:d.data()})).sort((x,y)=>x.data.creado.toMillis()-y.data.creado.toMillis());
    const ids = [...new Set(hist.docs.map(d=>d.data.evento).filter(e=>e && e!=="domicilio"))];
    hist.evNames = {};
    await Promise.all(ids.map(async id=>{ try{ const e = ev(id) || (await getDoc(doc(db,"eventos",id))).data(); hist.evNames[id] = e?.nombre || id; }catch{ hist.evNames[id] = id; } }));
  }catch(e){ hist.docs = []; hist.msg = "No se pudo buscar. Revisa el internet."; }
  render();
}
function descargarHist(){
  const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const rows = [["Fecha","Hora","Tipo","Evento","Barra","Número","Nombre","Bebidas","Detalle","Pago","Total","Teléfono","Dirección","Referencias","Ubicación","Comprobante","Estado","Motivo cancelación","Reembolso","Motivo reembolso","Cupón","Descuento"]];
  hist.docs.forEach(({data:p})=>{
    const f = p.creado.toDate();
    rows.push([ymd(f), f.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}), p.modo==="domicilio"?"Domicilio":"Evento",
      p.evento==="domicilio"?"":(hist.evNames[p.evento]||""), p.barra||"", p.numero, p.nombre,
      (p.items||[]).map(it=>`${it.cant}x ${it.nombre}${it.tam?" ("+it.tam+")":""}`).join(" + "),
      (p.items||[]).map(it=>[...(it.opciones||[]), it.nota?"Nota: "+it.nota:""].filter(Boolean).join(", ")).filter(Boolean).join(" | "),
      p.pago||"", p.modo==="domicilio"?(p.total||0):"", p.tel||"", p.direccion||"", p.ref||"",
      p.ubicacion?`https://maps.google.com/?q=${p.ubicacion.lat},${p.ubicacion.lng}`:"", p.comprobante?"Sí":"", p.estado, p.cancelMotivo||"", p.reembolso?p.reembolso.monto:"", p.reembolso?p.reembolso.motivo:"", p.cupon||"", p.descuento||""]);
  });
  const csv = "\ufeff" + rows.map(r=>r.map(q).join(",")).join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `pedidos_${hist.desde}_al_${hist.hasta}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  hist.descargado = true; hist.msg = "Archivo descargado. Revisa que esté en tu celular antes de borrar."; render();
}
async function borrarHist(){
  const hoy = desdeRango("hoy").getTime();
  const lista = hist.docs.filter(d=>d.data.creado.toMillis() < hoy);
  hist.msg = "Borrando…"; hist.confirmar = false; render();
  try{
    for(let i=0;i<lista.length;i+=400){
      const b = writeBatch(db); lista.slice(i,i+400).forEach(d=>b.delete(doc(db,"pedidos",d.id))); await b.commit();
    }
    const quedan = hist.docs.length - lista.length;
    hist.docs = hist.docs.filter(d=>d.data.creado.toMillis() >= hoy);
    hist.msg = `Listo: se borraron ${lista.length} pedidos.${quedan?` ${quedan} de hoy se quedaron.`:""}`;
  }catch{ hist.msg = "No se pudo borrar. Revisa el internet e intenta de nuevo."; }
  render();
}

const conPrecio = p => p.modo==="domicilio" || (p.total||0)>0;
function precioIt(it){
  if(typeof it.precio==="number") return it.precio;            // pedidos nuevos: precio guardado
  const m = NFM.ITEMS.find(i=>i.name===it.nombre); if(!m) return 0; // pedidos viejos: se calcula del menú
  if(p_modoActual==="evento") return m.extraEvento||0;
  const extras = (it.opciones||[]).reduce((a,o)=>{ const x = /\(\+\$([\d,]+)\)/.exec(o); return a+(x?+x[1].replace(/,/g,""):0); },0);
  return (m.price||0) + (it.tam==="1 L" && !m.noSize ? 30 : 0) + extras;
}
let p_modoActual = "";
function desglose(p){
  p_modoActual = p.modo;
  const sub = (p.items||[]).reduce((a,it)=>a+precioIt(it)*(it.cant||1),0);
  const desc = p.descuento||0;
  const env = typeof p.envio==="number" ? p.envio : Math.max(0, (p.total||0) - sub + desc); // pedidos viejos: lo que falta para cuadrar

}

function dashJSON(e){
  const vivos = pedidos.filter(p=>p.estado!=="cancelado");
  const ent = vivos.filter(p=>p.estado==="entregado");
  const tamTxt = t => t==="½ L" ? "Chica" : t==="1 L" ? "Grande" : (t||"");
  const cuenta = {};
  ent.forEach(p=>(p.items||[]).forEach(it=>{
    const sab = ((it.opciones||[]).find(o=>/^Sabor:\s*/.test(o))||"").replace(/^Sabor:\s*/,"").replace(/^—$/,"");
    const k = [it.nombre, tamTxt(it.tam), sab].join("|");
    cuenta[k] = (cuenta[k]||0) + (it.cant||1);
  }));
  let f; try{ f = e.creado.toDate(); }catch{ f = new Date(); }
  return JSON.stringify({
    tipo:"nanos-pedidos", v:1, evento:e.nombre, fecha:ymd(f),
    pedidos: vivos.length,
    bebidas: vivos.reduce((a,p)=>a+(p.items||[]).reduce((x,it)=>x+(it.cant||1),0),0),
    cancelados: pedidos.length - vivos.length,
    pendientes: vivos.length - ent.length,
    items: Object.entries(cuenta).sort((a,b)=>b[1]-a[1]).map(([k,c])=>{ const [n,tam,sabor] = k.split("|"); return {n,tam,sabor,c}; })
  });
}
async function copiarDash(id){
  const e = ev(id); if(!e) return;
  const txt = dashJSON(e);
  try{ await navigator.clipboard.writeText(txt); }
  catch{ const ta = document.createElement("textarea"); ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  const m = document.createElement("div"); m.textContent = "Copiado ✓";
  m.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2ecc71;color:#fff;font-weight:800;padding:12px 26px;border-radius:999px;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:18px";
  document.body.appendChild(m); setTimeout(()=>m.remove(), 1800);
}

const logoImg = new Image(); logoImg.src = "logo.png";
const beerImg = new Image(); beerImg.src = "logo-beer.png";
function logosDe(marca){ return marca==="ambos" ? [logoImg, beerImg] : marca==="beer" ? [beerImg] : [logoImg]; }
const imgOk = im => im.complete && im.naturalWidth;
function drawQRs(){
  const e = sel.view==="fijos" ? FIJO_EV : ev(sel.evento); if(!e || !window.qrcode) return;
  document.querySelectorAll(".qrc").forEach(cv=>{
    const b = +cv.dataset.b, url = cv.dataset.url || `${BASE}?e=${e.id}${e.barras>1?"&b="+b:""}`, en = cv.dataset.nombre || e.nombre, bl = bName(e,b);
    const draw = ()=>{
      const c = cv.getContext ? cv.getContext("2d") : null, W=1200, H=1800; if(!c) return;
      const g = c.createRadialGradient(W/2,0,50,W/2,0,900); g.addColorStop(0,"#3a1d7a"); g.addColorStop(1,"#140a2e");
      c.fillStyle = g; c.fillRect(0,0,W,H);
      const lg = logosDe(cv.dataset.marca||e.marca||"fizz"), ls = lg.length>1 ? 230 : 260, lw = lg.length*ls + (lg.length-1)*30;
      lg.forEach((im,i)=>{ if(imgOk(im)) c.drawImage(im, (W-lw)/2 + i*(ls+30), 60 + (260-ls)/2, ls, ls); });
      c.textAlign = "center"; c.fillStyle = "#7dff3a"; c.font = "800 80px 'Lilita One', 'Arial Rounded MT Bold', sans-serif";
      c.fillText("¡Pide tu bebida!", W/2, 410);
      c.fillStyle = "#f3edff"; c.font = "700 46px Nunito, sans-serif";
      fitText(c, en, W/2, 480, 1040);
      if(e.barras>1){ c.fillStyle = "#ff4fb8"; c.font = "800 44px Nunito, sans-serif"; c.fillText(bl.toUpperCase(), W/2, 545); }
      const q = qrcode(0,"H"); q.addData(url); q.make();
      const n = q.getModuleCount(), size = 700, cell = size/n, x0 = (W-size)/2, y0 = 600;
      c.fillStyle = "#fff"; roundRect(c, x0-36, y0-36, size+72, size+72, 40); c.fill();
      c.lineWidth = 10; c.strokeStyle = "#ff4fb8"; c.stroke();
      c.fillStyle = "#140a2e";
      for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) c.fillRect(Math.floor(x0+k*cell), Math.floor(y0+r*cell), Math.ceil(cell), Math.ceil(cell));
      const lc = 140; c.fillStyle = "#fff"; c.beginPath(); c.arc(W/2, y0+size/2, lc/2+8, 0, 7); c.fill();
      if(imgOk(lg[0])) c.drawImage(lg[0], W/2-lc/2, y0+size/2-lc/2, lc, lc);
      c.textAlign = "left"; c.font = "800 42px Nunito, sans-serif";
      ["Escanea con la cámara de tu cel","Te avisamos cuando esté lista","Pasa a la barra con tu número"].forEach((t,i)=>{
        const y = 1430 + i*95;
        c.fillStyle = "#7dff3a"; c.beginPath(); c.arc(185, y-14, 32, 0, 7); c.fill();
        c.fillStyle = "#140a2e"; c.textAlign = "center"; c.fillText(String(i+1), 185, y);
        c.fillStyle = "#f3edff"; c.textAlign = "left"; c.fillText(t, 240, y);
      });
      const img = document.querySelector(cv.dataset.url?`.qri[data-url="${cv.dataset.url}"]`:`.qri[data-b="${b}"]`); if(img) img.src = cv.toDataURL("image/png");
    };
    document.fonts?.ready ? document.fonts.ready.then(draw) : draw();
    if(!imgOk(logoImg) || !imgOk(beerImg)){ logoImg.addEventListener("load", drawQRs, {once:true}); beerImg.addEventListener("load", drawQRs, {once:true}); }
  });

function drawTents(){
  const e = sel.view==="fijos" ? FIJO_EV : ev(sel.evento); if(!e || !window.qrcode) return;
  const ready = ()=> logoImg.complete && logoImg.naturalWidth && beerImg.complete && beerImg.naturalWidth;
  if(!ready()){ logoImg.addEventListener("load", drawTents, {once:true}); beerImg.addEventListener("load", drawTents, {once:true}); return; }
  
  document.querySelectorAll(".tentc").forEach(cv=>{
    const marca = cv.dataset.marca || e.marca || "fizz", logos = logosDe(marca);
    const b = +cv.dataset.b, url = cv.dataset.url || `${BASE}?e=${e.id}${e.barras>1?"&b="+b:""}`, en = cv.dataset.nombre || e.nombre, bl = bName(e,b);
    const draw = ()=>{
      const c = cv.getContext ? cv.getContext("2d") : null; if(!c) return;
      const W = 2550, H = 3300, M = 125, FW = W - 2*M, FH = 960, TAB = 240;
      const yA = M, yB = yA + FH, yC = yB + FH, yT = yC + FH;
      c.fillStyle = "#fff"; c.fillRect(0,0,W,H);
      // fondos de cada cara
      const face = (y)=>{ const g = c.createLinearGradient(0,y,0,y+FH); g.addColorStop(0,"#2a1460"); g.addColorStop(1,"#140a2e"); c.fillStyle = g; c.fillRect(M,y,FW,FH); };
      face(yA); face(yB);
      c.fillStyle = "#1b0e3d"; c.fillRect(M,yC,FW,FH);
      c.fillStyle = "#e9e3f7"; c.fillRect(M,yT,FW,TAB);
      // ---- Cara B: QR (derecha)
      c.save(); c.translate(M, yB);
      const q = qrcode(0,"H"); q.addData(url); q.make();
      const n = q.getModuleCount(), qs = 760, cell = qs/n, qx = FW - qs - 110, qy = (FH - qs)/2;
      c.fillStyle = "#fff"; roundRect(c, qx-30, qy-30, qs+60, qs+60, 36); c.fill(); c.lineWidth = 10; c.strokeStyle = "#ff4fb8"; c.stroke();
      c.fillStyle = "#140a2e";
      for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) c.fillRect(Math.floor(qx+k*cell), Math.floor(qy+r*cell), Math.ceil(cell), Math.ceil(cell));
      const lc = 120; c.fillStyle = "#fff"; c.beginPath(); c.arc(qx+qs/2, qy+qs/2, lc/2+8, 0, 7); c.fill();
      c.drawImage(logos[0], qx+qs/2-lc/2, qy+qs/2-lc/2, lc, lc);
      const lx = 110; let lgx = lx;
      logos.forEach(im=>{ c.drawImage(im, lgx, 90, 230, 230); lgx += 250; });
      c.textAlign = "left"; c.fillStyle = "#7dff3a"; c.font = "400 118px 'Lilita One', 'Arial Rounded MT Bold', sans-serif";
      c.fillText("¡Pide tu bebida", lx, 450); c.fillText("desde tu cel!", lx, 575);
      c.fillStyle = "#f3edff"; c.font = "800 58px Nunito, sans-serif"; c.fillText("Escanea el código con tu cámara", lx, 690);
      c.fillStyle = "#ffc53d"; c.font = "800 52px Nunito, sans-serif"; fitTextW(c, en + (e.barras>1 ? "  ·  "+bl : ""), lx, 800, qx - lx - 80);
      c.restore();
      // ---- Cara A: instrucciones (de cabeza para que quede derecha al doblar)
      c.save(); c.translate(M+FW, yA+FH); c.rotate(Math.PI);
      c.textAlign = "left"; c.fillStyle = "#7dff3a"; c.font = "400 100px 'Lilita One', 'Arial Rounded MT Bold', sans-serif";
      c.fillText("¿Cómo pido mi bebida?", 110, 175);
      const pasos = [["Escanea el QR","con la cámara de tu celular (está del otro lado)"],["Elige tu bebida","y escribe tu nombre"],["Espera tu número","te avisamos en tu cel y en la pantalla de la barra"],["Pasa a la barra","di tu número y ¡disfruta!"]];
      const colW = (FW - 220) / 4;
      pasos.forEach(([t,d],i)=>{
        const x = 110 + i*colW, cx = x + 70;
        c.fillStyle = "#ff4fb8"; c.beginPath(); c.arc(cx, 330, 70, 0, 7); c.fill();
        c.fillStyle = "#fff"; c.textAlign = "center"; c.font = "400 92px 'Lilita One', sans-serif"; c.fillText(String(i+1), cx, 362);
        c.textAlign = "left"; c.fillStyle = "#f3edff"; c.font = "800 54px Nunito, sans-serif"; wrap(c, t, x, 480, colW - 40, 62);
        c.fillStyle = "#b9a9e6"; c.font = "700 40px Nunito, sans-serif"; wrap(c, d, x, 560, colW - 50, 50);
      });
      c.fillStyle = "#ffc53d"; c.font = "800 44px Nunito, sans-serif"; c.textAlign = "center";
      c.fillText("Una bebida a la vez · No cierres la página mientras esperas" + (marca!=="fizz" ? " · Alcohol solo +18" : ""), FW/2, FH - 70);
      c.restore();
      // ---- Base: logos
      c.save(); c.translate(M, yC); let bx = FW/2 - (logos.length*300 - 40)/2;
      logos.forEach(im=>{ c.globalAlpha = .9; c.drawImage(im, bx, (FH-260)/2, 260, 260); bx += 300; }); c.globalAlpha = 1;
      c.fillStyle = "#b9a9e6"; c.font = "800 44px Nunito, sans-serif"; c.textAlign = "center"; c.fillText("BASE", FW/2, FH - 60); c.restore();
      // ---- Pestaña
      c.fillStyle = "#6b5aa0"; c.font = "800 44px Nunito, sans-serif"; c.textAlign = "center"; c.fillText("PEGAR AQUÍ (debajo de la base)", W/2, yT + TAB/2 + 16);
      // ---- Líneas de doblez y corte
      c.setLineDash([28,20]); c.lineWidth = 6; c.strokeStyle = "#ff4fb8";
      [yB, yC, yT].forEach(y=>{ c.beginPath(); c.moveTo(M-60,y); c.lineTo(W-M+60,y); c.stroke(); });
      c.setLineDash([]); c.lineWidth = 3; c.strokeStyle = "#999"; c.strokeRect(M, yA, FW, 3*FH + TAB);
      c.fillStyle = "#888"; c.font = "700 36px Nunito, sans-serif"; c.textAlign = "left";
      c.fillText("✂ Recorta por la orilla gris  ·  Dobla en las líneas rosas punteadas", M, H - 50);
      const img = document.querySelector(cv.dataset.url?`.tenti[data-url="${cv.dataset.url}"]`:`.tenti[data-b="${b}"]`); if(img) img.src = cv.toDataURL("image/png");
    };
    document.fonts?.ready ? document.fonts.ready.then(draw) : draw();
  });
}
function wrap(c, text, x, y, max, lh){
  const words = String(text).split(" "); let line = "";
  for(const w of words){ const t = line ? line+" "+w : w; if(c.measureText(t).width > max && line){ c.fillText(line, x, y); y += lh; line = w; } else line = t; }
  if(line) c.fillText(line, x, y);
}
function fitTextW(c, t, x, y, max){ let size = parseInt(c.font.match(/(\d+)px/)[1],10); while(c.measureText(t).width > max && size > 28){ size -= 2; c.font = c.font.replace(/\d+px/, size+"px"); } c.fillText(t, x, y); }
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function fitText(c,t,x,y,max){ let s = 46; while(c.measureText(t).width > max && s > 24){ s -= 2; c.font = `700 ${s}px Nunito, sans-serif`; } c.fillText(t,x,y); }

  const ok = u && u.email === EMAIL;
  $("#login").hidden = ok; $("#panel").hidden = !ok;
  if(ok){ store.set("nf_staff","1"); listenEventos(); listenPedidos(); listenConfig(); render(); if(sel.view==="stats") cargarStats(); }
  else { unsubEv && unsubEv(); unsubPed && unsubPed(); unsubEv = unsubPed = null; known = null; pedidos = []; eventos = []; }
});
$("#loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn = $("#loginBtn"); btn.disabled = true; $("#loginErr").textContent = "";
  try{ await signInWithEmailAndPassword(auth, EMAIL, $("#pass").value); }
  catch{ $("#loginErr").textContent = "Contraseña incorrecta. Revisa e intenta de nuevo."; }
  btn.disabled = false;
});
document.addEventListener("submit", async e=>{
  if(e.target.id==="cupForm"){
    e.preventDefault();
    const cod = $("#cupCod").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,""), tipo = $("#cupTipo").value, valor = parseInt($("#cupVal").value||"0",10)||0;
    let desc = $("#cupDesc").value.trim();
    if(!cod){ $("#cupErr").textContent = "Escribe el código."; return; }
    if(tipo!=="envio" && valor<=0){ $("#cupErr").textContent = "Pon el valor del descuento."; return; }
    if(tipo==="pct" && valor>100){ $("#cupErr").textContent = "El porcentaje no puede ser mayor a 100."; return; }
    if(!desc) desc = tipo==="pct" ? valor+"% de descuento en tu pedido" : tipo==="monto" ? "$"+valor+" de descuento en tu pedido" : "Envío gratis en tu pedido";
    try{ await guardarCupon(cod, {tipo, valor, desc, activo:true}); }catch{ $("#cupErr").textContent = "No se pudo guardar. Revisa el internet."; }
    return;
  }
  if(e.target.id==="hsForm"){ e.preventDefault(); const a = $("#hsDe").value, b = $("#hsA").value; if(a && b && a<=b) buscarHist(a,b); return; }
  if(e.target.id==="hrForm"){
    e.preventDefault();
    const dias = {};
    for(let i=0;i<7;i++){
      const turnos = [{abre: $("#hab"+i).value || "13:00", cierra: $("#hci"+i).value || "21:00"}];
      if($("#h2on"+i).checked) turnos.push({abre: $("#hab2"+i).value || "17:00", cierra: $("#hci2"+i).value || "21:00"});
      dias[i] = {on: $("#hon"+i).checked, turnos};
    }
    const data = {modo: $("#hrModo").value, aviso: $("#hrAviso").value.trim(), dias};
    $("#hrBtn").disabled = true;
    try{ await setDoc(doc(db,"config","tienda"), data); tienda = data; $("#hrMsg").style.color = "var(--neon)"; $("#hrMsg").textContent = "Guardado ✓"; }
    catch{ $("#hrMsg").textContent = "No se pudo guardar. Revisa el internet."; }
    $("#hrBtn").disabled = false; return;
  }
  if(e.target.id!=="evForm") return;
  e.preventDefault();
  const nombre = $("#evNombre").value.trim(), personas = parseInt($("#evPersonas").value,10), marca = $("#evMarca").value;
  const fisicas = [...document.querySelectorAll('.fisg input:checked')].map(x=>+x.value), barras = Math.max(1, fisicas.length);
  if(!fisicas.length){ $("#evErr").textContent = "Elige al menos una barra."; return; }
  if(!nombre || !(personas>0)){ $("#evErr").textContent = "Pon el nombre y el número de personas."; return; }
  $("#evBtn").disabled = true;
  try{
    const ref = await addDoc(collection(db,"eventos"), {nombre, personas, barras, fisicas, marca, estado:"activo", creado: serverTimestamp()});
    const na = {...asign}; fisicas.forEach((n,i)=>{ na[n] = {e: ref.id, b: i+1}; }); await guardarAsign(na);
    if(!ev(ref.id)) eventos.unshift({id:ref.id, nombre, personas, barras, fisicas, marca, estado:"activo", creado:null});
    go({view:"qr", evento: ref.id});
  }catch{ $("#evErr").textContent = "No se pudo crear. Revisa el internet."; $("#evBtn").disabled = false; }
});
document.addEventListener("click", async e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.acc){ accion = {id:t.dataset.pid, tipo:t.dataset.acc, motivo:""}; render(); return; }
  if(t.dataset.mot){ accion.motivo = t.dataset.mot; render(); return; }
  if(t.dataset.accno!==undefined){ accion = null; render(); return; }
  if(t.dataset.reembdel){ t.disabled = true; try{ await updateDoc(doc(db,"pedidos",t.dataset.reembdel), {reembolso:null}); accion = null; }catch{} render(); return; }
  if(t.dataset.accok){
    const id = t.dataset.accok, p = pedidos.find(x=>x.id===id); if(!p || !accion.motivo) return;
    const motivo = accion.motivo==="Otro" ? (($("#motOtro"+id)?.value||"").trim() || "Otro") : accion.motivo;
    t.disabled = true;
    try{
      if(accion.tipo==="cancel") await updateDoc(doc(db,"pedidos",id), {estado:"cancelado", cancelMotivo:motivo, canceladoEn:serverTimestamp()});
      else { const monto = Math.max(0, parseInt($("#monto"+id)?.value||"0",10)||0); await updateDoc(doc(db,"pedidos",id), {reembolso:{monto, motivo, en:Timestamp.now()}}); }
      accion = null;
    }catch{ t.disabled = false; alert("No se pudo guardar. Revisa el internet."); return; }
    render(); return;
  }
  if(t.dataset.comp){ const p = pedidos.find(x=>x.id===t.dataset.comp); if(p){ $("#modalImg").src = p.comprobante; $("#modal").hidden = false; } }
  else if(t.dataset.closemodal!==undefined){ $("#modal").hidden = true; }
  else if(t.dataset.tab){ tab = t.dataset.tab; render(); }
  else if(t.dataset.cola){ go({view:"cola", evento:t.dataset.cola, barra:+t.dataset.b||0}); }
  else if(t.dataset.pant){ go({view:"pantalla", evento:t.dataset.pant, barra:+t.dataset.b||0}); if(!soundOn) $("#soundBtn").click(); try{ document.documentElement.requestFullscreen?.().catch(()=>{}); }catch{} }
  else if(t.dataset.salirtv!==undefined){ try{ document.fullscreenElement && document.exitFullscreen(); }catch{} go({view:"home"}); }
  else if(t.dataset.qr){ go({view:"qr", evento:t.dataset.qr}); }
  else if(t.dataset.res){ cerrando = null; go({view:"resumen", evento:t.dataset.res}); }
  else if(t.dataset.home!==undefined){ go({view:"home"}); }
  else if(t.dataset.cuptog){ const k = t.dataset.cuptog; try{ await guardarCupon(k, {...cupones[k], activo: !cupones[k].activo}); }catch{} }
  else if(t.dataset.cupdel){ const k = t.dataset.cupdel; if(cupBorrar!==k){ cupBorrar = k; render(); return; } cupBorrar = null; if(cupQR===k) cupQR = null; try{ await guardarCupon(k, null); }catch{} }
  else if(t.dataset.cupqr){ cupQR = cupQR===t.dataset.cupqr ? null : t.dataset.cupqr; render(); }
  else if(t.dataset.cupusos){ const k = t.dataset.cupusos; t.textContent = "Contando…";
    try{ const sn = await getDocs(query(collection(db,"pedidos"), where("cupon","==",k))); cupUsos[k] = sn.docs.filter(d=>d.data().estado!=="cancelado").length; }catch{ cupUsos[k] = 0; } render(); }
  else if(t.dataset.alcohol!==undefined){ const v = !alcoholDom; alcoholDom = v; render(); try{ await setDoc(doc(db,"config","alcohol"), {domicilio: v}); }catch{ alcoholDom = !v; render(); } }
  else if(t.dataset.view){ if(t.dataset.view==="historial") hist = null; go({view:t.dataset.view}); if(t.dataset.view==="stats") cargarStats(); }
  else if(t.dataset.sr){ statsR = t.dataset.sr; cargarStats(); }
  else if(t.dataset.rango){ domRango = t.dataset.rango; known = null; listenPedidos(); render(); }
  else if(t.dataset.hq){
    const now = new Date(); let a, b;
    if(t.dataset.hq==="semana-pasada"){ [a,b] = semanaPasada(); }
    else if(t.dataset.hq==="mes-pasado"){ const x = new Date(now.getFullYear(), now.getMonth()-1, 1), y = new Date(now.getFullYear(), now.getMonth(), 0); a = ymd(x); b = ymd(y); }
    else { a = ymd(new Date(now.getFullYear(), now.getMonth(), 1)); b = ymd(now); }
    $("#hsDe").value = a; $("#hsA").value = b; buscarHist(a,b);
  }
  else if(t.dataset.hdl!==undefined){ descargarHist(); }
  else if(t.dataset.hpre!==undefined){ hist.confirmar = true; render(); }
  else if(t.dataset.hno!==undefined){ hist.confirmar = false; render(); }
  else if(t.dataset.hdel!==undefined){ borrarHist(); }
  else if(t.dataset.mmarca){ menuMarca = t.dataset.mmarca; render(); }
  else if(t.dataset.ag){ setAgotado(t.dataset.ag, !agotados[t.dataset.ag]); }
  else if(t.dataset.vercerr!==undefined){ t.disabled = true; t.textContent = "Cargando…"; cargarCerrados(); }
  else if(t.dataset.reabrir){
    t.disabled = true;
    try{ await updateDoc(doc(db,"eventos",t.dataset.reabrir), {estado:"activo"});
      const re = ev(t.dataset.reabrir), na = {...asign}, choque = [];
      (re?.fisicas||[]).forEach((n,i)=>{ if(na[n] && na[n].e!==re.id && eventos.some(x=>x.id===na[n].e)) choque.push(n); else na[n] = {e: re.id, b: i+1}; });
      await guardarAsign(na); if(choque.length) alert("Ojo: la barra "+choque.join(", ")+" ya está en otro evento activo. Su QR fijo sigue apuntando a ese otro evento."); if(cerrados) cerrados = cerrados.filter(e=>e.id!==t.dataset.reabrir); go({view:"home"}); }
    catch{ t.disabled = false; }
  }
  else if(t.dataset.precerrar){ cerrando = t.dataset.precerrar; render(); }
  else if(t.dataset.dash){ copiarDash(t.dataset.dash); }
  else if(t.dataset.nocerrar!==undefined){ cerrando = null; render(); }
  else if(t.dataset.cerrar){
    t.disabled = true;
    try{ await updateDoc(doc(db,"eventos",t.dataset.cerrar), {estado:"cerrado"}); await guardarAsign(asignSin(t.dataset.cerrar)); cerrando = null; if(cerrados){ const e = eventos.find(x=>x.id===t.dataset.cerrar); if(e) cerrados.unshift({...e, estado:"cerrado"}); } go({view:"home"}); }
    catch{ t.disabled = false; }
  }
  else if(t.dataset.to){
    t.disabled = true;
    try{ await updateDoc(doc(db,"pedidos",t.dataset.id), {estado:t.dataset.to}); }
    catch{ t.disabled = false; }
  }
  else if(t.id==="soundBtn"){
    unlockSound();
    soundOn = !soundOn; t.textContent = soundOn ? "🔔 Sonido activado" : "🔕 Activar sonido"; t.setAttribute("aria-pressed", soundOn);
    if(soundOn){ setTimeout(()=>ring("🔔 Prueba"), 300); keepAwake(); }
  }
  else if(t.id==="outBtn") signOut(auth);
});
setInterval(()=>{ if(sel.view==="cola" && pedidos.length) render(); }, 60000);

</script>
