<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140a2e">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>Nano's Fizz Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}

/* Layout: app de una columna, carrito fijo abajo; mundo "galaxia neón" de la marca, solo tema oscuro por diseño */
:root{
  --bg:#140a2e; --panel:#21124a; --panel2:#2c1a5e; --line:#3f2a7a;
  --fg:#f3edff; --muted:#b9a9e6; --neon:#7dff3a; --pink:#ff4fb8; --gold:#ffc53d;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;padding-inline:16px;padding-block:0 120px;
  background-image:radial-gradient(1px 1px at 20% 30%,#fff8 50%,transparent),radial-gradient(1px 1px at 70% 10%,#fff6 50%,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff5 50%,transparent),radial-gradient(1px 1px at 40% 80%,#fff6 50%,transparent),radial-gradient(ellipse at top,#3a1d7a 0%,var(--bg) 60%);
  background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto}
header{padding-block:22px 10px;display:flex;align-items:center;gap:12px}
.logo{width:76px;height:76px;flex:none;filter:drop-shadow(0 0 12px #ff4fb866)}
h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;color:var(--neon);letter-spacing:.5px;text-shadow:0 0 14px #7dff3a55}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border-radius:14px;padding:4px;margin-block:12px;border:1px solid var(--line)}
.mode button{all:unset;cursor:pointer;text-align:center;padding:10px 6px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--pink);color:#fff}
.mode button:focus-visible,.chip:focus-visible,.card:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.note{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-top:8px;z-index:2}
.chip{all:unset;cursor:pointer;white-space:nowrap;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--neon);color:var(--neon)}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:22px 0 10px;color:var(--gold)}
.list{display:grid;gap:10px}
.card{all:unset;cursor:pointer;display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.card>div{min-width:0}
.cup{width:54px;height:62px;border-radius:6px 6px 14px 14px;position:relative;overflow:hidden;border:2px solid #ffffff30}
.cup::after{content:"";position:absolute;inset:auto 8px 6px;height:18px;border-radius:50%;background:#ffffff22}
.cup i{position:absolute;top:-6px;left:60%;width:4px;height:30px;background:var(--gold);transform:rotate(12deg);border-radius:2px}
.name{font-weight:800;font-size:16px}
.desc{color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:3px}
.price{font-family:var(--display);font-size:20px;color:var(--neon)}
.cart{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);z-index:5}
.cart button,.primary{all:unset;cursor:pointer;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;width:100%;max-width:560px;margin:0 auto;background:var(--neon);color:#1a0b3a;font-weight:800;font-size:16px;padding:15px 18px;border-radius:14px}
.primary{justify-content:center;text-align:center}
.primary[disabled]{opacity:.45;cursor:not-allowed}
.sheetbg{position:fixed;inset:0;background:#0009;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--pink)}
.sheet h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--neon)}
.grp{margin-top:16px}
.grp b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0}
.opt span{display:block;padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;font-size:14px;cursor:pointer}
.opt input:checked+span{border-color:var(--neon);background:#7dff3a1a;color:var(--neon)}
.opt input:focus-visible+span{outline:2px solid var(--neon)}
label.f{display:block;margin-top:12px;font-weight:700;font-size:13px}
input.t,textarea.t{width:100%;margin-top:5px;background:var(--bg);border:1.5px solid var(--line);color:var(--fg);border-radius:10px;padding:11px;font:inherit}
textarea.t{min-height:60px;resize:vertical}
.qty{display:flex;align-items:center;gap:14px;margin-top:18px}
.qty button{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;background:var(--panel2);text-align:center;font-size:22px;line-height:38px;font-weight:800}
.qty output{font-weight:800;font-size:18px;min-width:20px;text-align:center}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.row div{min-width:0}
.row small{color:var(--muted);display:block}
.rm{all:unset;cursor:pointer;color:var(--pink);font-size:12.5px;font-weight:700}
.total{display:flex;justify-content:space-between;font-family:var(--display);font-size:22px;margin:12px 0 4px}
.total span:last-child{color:var(--neon);font-variant-numeric:tabular-nums}
.close{all:unset;cursor:pointer;float:right;color:var(--muted);font-weight:800;padding:4px 8px}
.err{color:var(--pink);font-size:13px;font-weight:700;margin-top:10px}
.ok{background:#7dff3a1a;border:1px solid var(--neon);border-radius:12px;padding:12px;font-size:13.5px;margin-top:12px}
.ok a{color:var(--neon);font-weight:800}
.badge{display:inline-block;font-size:11px;font-weight:800;background:var(--pink);color:#fff;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.primary[disabled]{opacity:.5}
.ghost{all:unset;cursor:pointer;box-sizing:border-box;display:block;width:100%;text-align:center;padding:13px;border-radius:14px;border:1.5px solid var(--line);color:var(--muted);font-weight:800;margin-top:18px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px 18px;text-align:center;margin-top:8px}
.st .primary{margin-top:18px}
.lbl{margin:0;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.num{font-family:var(--display);font-size:72px;line-height:1;color:var(--neon);text-shadow:0 0 22px #7dff3a66;font-variant-numeric:tabular-nums}
.who{margin:4px 0 16px;font-weight:800;font-size:18px}
.wait{font-size:16px;font-weight:700;line-height:1.5;margin:0 0 16px}
.wait small{color:var(--muted);font-weight:600}
.ready{background:var(--neon);color:#1a0b3a;font-family:var(--display);font-size:28px;border-radius:18px;padding:18px 12px;margin-bottom:16px;animation:pulse 1.2s ease-in-out infinite}
.ready span{display:block;font-family:var(--body);font-size:15px;font-weight:800;margin-top:4px}
.ready.done{background:var(--pink);color:#fff;animation:none}
@keyframes pulse{50%{transform:scale(1.03);box-shadow:0 0 30px #7dff3a88}}
@media (prefers-reduced-motion:reduce){.ready{animation:none}}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps li{font-size:11.5px;font-weight:800;color:var(--muted);padding-top:10px;border-top:4px solid var(--line)}
.steps li.pas{border-color:var(--pink);color:var(--fg)}
.steps li.now{border-color:var(--neon);color:var(--neon)}
.mini{margin-top:16px;color:var(--muted);font-size:13.5px;line-height:1.6}
.mrow{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.mrow:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.mnum{font-family:var(--display);font-size:26px;color:var(--neon);font-variant-numeric:tabular-nums}
.mtxt{min-width:0}.mtxt b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mtxt small{color:var(--muted);font-size:12px}
.pill{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.preparando{color:var(--gold)}.pill.lista{background:var(--neon);color:#1a0b3a}.pill.entregado{opacity:.6}
#mine{margin-bottom:6px}
body.flash{animation:fl 1s steps(2) 8}
@keyframes fl{50%{background:#3b1468}}
@media (prefers-reduced-motion:reduce){body.flash{animation:none}}
.aviso{background:#ffc53d1f;border:1.5px solid var(--gold);border-radius:14px;padding:12px 14px;text-align:left;font-size:13.5px;line-height:1.45;margin:0 0 16px}
.aviso b{display:block;color:var(--gold);font-size:14.5px;margin-bottom:4px}
.aviso small{display:block;margin-top:6px;color:var(--muted)}
.ph{width:72px;height:90px;object-fit:cover;border-radius:12px;display:block}
.phbig{display:block;width:150px;height:188px;object-fit:cover;border-radius:16px;margin:0 auto 12px;box-shadow:0 8px 30px #0008}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <img class="logo" alt="Logo Nano's Fizz" src="logo.png">
    <div><h1>Nano's Fizz</h1><p class="sub" id="evName">Pide desde tu cel. Nosotros te avisamos.</p></div>
  </header>
  <div id="menuWrap">

</div>

<div class="cart" id="cartBar" hidden><button id="openCart"><span id="cartCount">0 bebidas</span><span>Ver pedido · <span id="cartTotal">$0</span></span></button></div>

// Envío: $20 con 1 bebida; gratis desde 2 bebidas
function envio(){ const n = cart.reduce((a,l)=>a+l.qty,0); return n>=2 ? 0 : 20; }
// Datos para transferencia (se muestran al cliente si están llenos)
const TRANSFER = { banco:"Plata", titular:"Adrián Sánchez González", clabe:"646198405606567407" };

let cat = "todas", cart = [], pendingBeep = false;
const QS = new URLSearchParams(location.search);
const E = QS.get("e") || "", BARRA = Math.max(1, Math.min(9, parseInt(QS.get("b")||"1",10)||1));
let mode = E ? "evento" : "domicilio", evento = null, eventoOk = !E;
const $ = s => document.querySelector(s);
const money = n => "$" + n.toLocaleString("es-MX");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k){ try{return localStorage.getItem(k)}catch{return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch{} }, del(k){ try{localStorage.removeItem(k)}catch{} } };

// Modo inicial desde el link: ?modo=domicilio

function setModeUI(){
  if(mode==="evento"){
    $("#evName").textContent = evento ? evento.nombre : "Cargando evento…";
    $("#modeNote").textContent = !E ? "" : (evento && evento.estado!=="activo") || (evento===false)
      ? "Este evento ya terminó y no recibe pedidos. ¡Gracias por venir!"
      : "Tus bebidas ya están incluidas en el evento. Pide aquí y te avisamos en esta pantalla cuando esté lista para que pases a la barra.";
  }else{
    $("#evName").textContent = "Pedidos a domicilio";
    $("#modeNote").textContent = "Bebidas de medio litro. Agranda a 1 litro por +$30.";
  }
}
async function loadEvento(){
  if(!E) return;
  try{
    const snap = await getDoc(doc(db,"eventos",E));
    evento = snap.exists() ? {id:snap.id, ...snap.data()} : false;
  }catch{ evento = false; }
  eventoOk = !!(evento && evento.estado==="activo");
  setModeUI(); renderMine();
}
function renderChips(){
  const all = [{id:"todas",name:"Todas"}, ...CATS];
  $("#chips").innerHTML = all.map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="${cat===c.id}">${c.name}</button>`).join("");
}
function cupStyle(i){ const [a,b]=i.color.split(","); return `background:linear-gradient(${a},${b})`; }
function renderMenu(){
  const cats = cat==="todas" ? CATS : CATS.filter(c=>c.id===cat);
  $("#menu").innerHTML = cats.map(c=>`<h2>${c.name}</h2><div class="list">${
    ITEMS.filter(i=>i.cat===c.id).map(i=>`<button class="card" data-i="${i.id}">
      ${FOTOS[i.id]?`<img class="ph" src="${FOTOS[i.id]}" alt="" loading="lazy">`:`<span class="cup" style="${cupStyle(i)}"><i></i></span>`}
      <div><div class="name">${i.name}</div><div class="desc">${i.desc}</div></div>
      ${mode==="domicilio"?`<span class="price">${money(i.price)}</span>`:`<span class="price" style="font-size:14px">Pedir</span>`}</button>`).join("")}</div>`).join("");
}
function cartTotal(){ return cart.reduce((a,l)=>a+l.qty*l.unit,0); }
function renderCart(){
  const n = cart.reduce((a,l)=>a+l.qty,0);
  $("#cartBar").hidden = n===0 || !$("#status").hidden;
  $("#cartCount").textContent = n + (n===1?" bebida":" bebidas");
  $("#cartTotal").textContent = mode==="evento" ? "Listo" : money(cartTotal()+envio());
}
function openSheet(html){ $("#sheet").innerHTML = html; $("#sheetBg").hidden = false; }
function closeSheet(){ $("#sheetBg").hidden = true; }

function openItem(id){
  if(mode==="evento" && !eventoOk) return closedSheet();
  if(mode==="evento"){ const a = activeEvento(); if(a) return lockSheet(a); }
  const i = ITEMS.find(x=>x.id===id);
  const g = i.groups.map((gr,gi)=>`<div class="grp"><b>${gr.name}</b><div class="opts">${
    gr.opts.map((o,oi)=>`<label class="opt"><input type="radio" name="g${gi}" id="g${gi}o${oi}" value="${esc(o)}" ${oi===0?"checked":""}><span>${o}</span></label>`).join("")}</div></div>`).join("");
  openSheet(`<button class="close" data-close>Cerrar ✕</button>${FOTOS[i.id]?`<img class="phbig" src="${FOTOS[i.id]}" alt="">`:""}<h3>${i.name}</h3><p class="desc">${i.desc}</p>
    <div class="grp"><b>Tamaño</b><div class="opts">
      <label class="opt"><input type="radio" name="size" id="s1" value="0" checked><span>½ litro${mode==="domicilio"?" · "+money(i.price):""}</span></label>
      <label class="opt"><input type="radio" name="size" id="s2" value="1"><span>1 litro${mode==="domicilio"?" · "+money(i.price+EXTRA_LITRO):""}</span></label>
    </div></div>${g}
    ${mode==="domicilio" && (EXTRAS[i.id]||[]).length ? `<div class="grp"><b>Extras</b><div class="opts">${EXTRAS[i.id].map((x,xi)=>`<label class="opt"><input type="checkbox" name="ex" id="ex${xi}" value="${xi}"><span>${esc(x.n)} · +${money(x.p)}</span></label>`).join("")}</div></div>` : ""}

// ===== Timbre fuerte: <audio> con WAV generado (suena aunque el iPhone esté en silencio) =====
function makeChime(){
  const sr = 22050, notes = [988, 1319, 1568, 1319, 1568, 2093], dur = 0.22, gap = 0.04, reps = 3, pause = 0.35;
  const one = notes.length*(dur+gap), total = reps*one + (reps-1)*pause;
  const n = Math.floor(total*sr), data = new Int16Array(n);
  for(let r=0;r<reps;r++){
    const off = r*(one+pause);
    notes.forEach((f,k)=>{
      const st = Math.floor((off + k*(dur+gap))*sr), len = Math.floor(dur*sr);
      for(let i=0;i<len && st+i<n;i++){
        const t = i/sr, env = Math.min(1, i/200) * Math.exp(-3*t);
        const v = Math.sin(2*Math.PI*f*t) + 0.5*Math.sin(2*Math.PI*2*f*t) + 0.25*Math.sign(Math.sin(2*Math.PI*f*t));
        data[st+i] = Math.max(-32767, Math.min(32767, v*env*20000));
      }
    });
  }
  const buf = new ArrayBuffer(44 + n*2), dv = new DataView(buf);
  const w = (o,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(o+i, s.charCodeAt(i)); };
  w(0,"RIFF"); dv.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); dv.setUint32(16,16,true);
  dv.setUint16(20,1,true); dv.setUint16(22,1,true); dv.setUint32(24,sr,true); dv.setUint32(28,sr*2,true);
  dv.setUint16(32,2,true); dv.setUint16(34,16,true); w(36,"data"); dv.setUint32(40,n*2,true);
  new Int16Array(buf,44).set(data);
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
}
const chime = new Audio(makeChime()); chime.preload = "auto";
let chimeReady = false;
try{ if(navigator.audioSession) navigator.audioSession.type = "playback"; }catch{}
// Llamar dentro de un toque del usuario para que el navegador permita sonar después
function unlockSound(){
  if(chimeReady) return;
  try{
    chime.muted = true;
    const p = chime.play();
    const done = ()=>{ chime.pause(); chime.currentTime = 0; chime.muted = false; chimeReady = true; };
    p && p.then ? p.then(done).catch(()=>{ chime.muted = false; }) : done();
  }catch{}
}
function ring(txt){
  try{ chime.currentTime = 0; chime.muted = false; chime.volume = 1; chime.play().catch(()=>{}); }catch{}
  try{ navigator.vibrate && navigator.vibrate([400,150,400,150,700]); }catch{}
  flash(txt);
}
let flashTimer = null;
function flash(txt){
  clearInterval(flashTimer); let k = 0; const t0 = window.__t0 || (window.__t0 = document.title);
  document.body.classList.add("flash");
  flashTimer = setInterval(()=>{
    document.title = (k++%2) ? t0 : (txt||"🔔 ¡Lista!");
    if(k>16){ clearInterval(flashTimer); document.title = t0; document.body.classList.remove("flash"); }
  }, 500);
}

function compressImage(file){
  return new Promise((ok,bad)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      let max = 1000, q = 0.7, out = "";
      for(let k=0;k<4;k++){
        const sc = Math.min(1, max/Math.max(img.width,img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        out = c.toDataURL("image/jpeg", q);
        if(out.length < 600000) break; max *= 0.8; q -= 0.1;
      }
      URL.revokeObjectURL(url); out.length < 850000 ? ok(out) : bad();
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); bad(); };
    img.src = url;
  });
}
function askLocation(btn){

  btn.textContent = "📍 Buscando tu ubicación…";
  navigator.geolocation.getCurrentPosition(pos=>{
    ubic = {lat:+pos.coords.latitude.toFixed(6), lng:+pos.coords.longitude.toFixed(6), prec:Math.round(pos.coords.accuracy||0)};
    btn.textContent = "📍 Ubicación agregada ✓ (toca para actualizar)";

}

const PASOS = {
  evento:   [["nuevo","Recibido"],["preparando","Preparando"],["lista","¡Lista!"],["entregado","Entregada"]],
  domicilio:[["nuevo","Recibido"],["preparando","Preparando"],["lista","En camino"],["entregado","Entregado"]]
};
const ESTADO_TXT = {nuevo:"En fila", preparando:"Preparando", lista:"¡Lista!", entregado:"Entregada"};
const VIDA = 14*3600*1000; // los pedidos se guardan en el celular 14 horas

// ===== Mis pedidos (se guardan en este celular) =====
let mine = [], data = {}, watchers = {}, viewing = null, autoOpen = null;
function loadMine(){
  try{ mine = JSON.parse(store.get("nf_mis") || "[]"); }catch{ mine = []; }
  const old = store.get("nf_pedido"); // pedido de la versión anterior
  if(old && !mine.some(m=>m.id===old)) mine.unshift({id:old, t:Date.now()});
  store.del("nf_pedido");
  mine = mine.filter(m=>Date.now()-m.t < VIDA).slice(0,10);
  saveMine();
}
function saveMine(){ store.set("nf_mis", JSON.stringify(mine.map(m=>({id:m.id,t:m.t})))); }
function activeEvento(){ return mine.map(m=>data[m.id]).find(p=>p && p.modo==="evento" && p.evento===E && p.estado!=="entregado"); }

function track(id){
  if(watchers[id]) return;
  watchers[id] = onSnapshot(doc(db,"pedidos",id), snap=>{
    if(!snap.exists()){
      watchers[id](); delete watchers[id]; delete data[id];
      mine = mine.filter(m=>m.id!==id); saveMine();
      if(viewing===id) backToMenu();
      renderMine(); return;
    }
    const prev = data[id], p = {id, ...snap.data()};
    data[id] = p;
    if(prev && prev.estado!=="lista" && p.estado==="lista"){ ring(); if(document.visibilityState!=="visible") pendingBeep = true; }
    if(p.estado==="entregado"){ watchers[id](); delete watchers[id]; }
    if(viewing===id) renderStatus(p);
    else if(autoOpen===id && viewing===null && p.estado!=="entregado") showStatus(id);
    if(autoOpen===id) autoOpen = null;
    renderMine();
  }, ()=>{ delete watchers[id]; if(viewing===id) $("#status").innerHTML = `<div class="st"><p class="err">Se perdió la conexión. Revisa tu señal y vuelve a abrir la página.</p><button class="ghost" id="backBtn">Volver al menú</button></div>`; });
}

function renderMine(){
  const list = mine.map(m=>data[m.id]).filter(p=>p && (E ? p.evento===E : p.modo==="domicilio"));
  const box = $("#mine");
  if(!list.length){ box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = `<h2 style="margin-top:4px">Mis pedidos</h2><div class="list">${list.map(p=>`
    <button class="mrow" data-mine="${p.id}">
      <span class="mnum">${esc(p.numero)}</span>
      <span class="mtxt"><b>${(p.items||[]).map(it=>`${it.cant>1?it.cant+"× ":""}${esc(it.nombre)}`).join(", ")}</b><small>${p.modo==="domicilio"?"A domicilio":"En el evento"}</small></span>
      <span class="pill ${p.estado}">${p.modo==="domicilio"&&p.estado==="lista"?"En camino":ESTADO_TXT[p.estado]||""}</span>
    </button>`).join("")}</div>`;
}

function showStatus(id){
  viewing = id; closeSheet();
  $("#menuWrap").hidden = true; $("#status").hidden = false; renderCart(); scrollTo(0,0);
  if(data[id]) renderStatus(data[id]); else $("#status").innerHTML = `<div class="st"><p class="note">Cargando tu pedido…</p></div>`;
  track(id);
}
function renderStatus(p){
  const pasos = PASOS[p.modo]||PASOS.evento, idx = Math.max(0, pasos.findIndex(x=>x[0]===p.estado));
  const big = p.estado==="lista"
    ? (p.modo==="evento" ? `<div class="ready">¡Tu bebida está lista! 🥤<span>Pasa a la barra y di tu número</span></div>` : `<div class="ready">¡Tu pedido va en camino! 🛵<span>Ten listo tu pago</span></div>`)
    : p.estado==="entregado" ? `<div class="ready done">¡Disfrútala! 💜</div>`
    : `<p class="wait">${p.estado==="preparando"?"Estamos preparando tu bebida…":"Recibimos tu pedido. Estás en la fila."}</p>
      ${p.modo==="evento"?`<div class="aviso"><b>📱 No cierres esta página ni bloquees tu celular.</b>Aquí te avisamos cuando tu bebida esté lista. Tu número también aparece en la pantalla de la barra.<small>¿Se cerró? Vuelve a escanear el QR: tu pedido sigue guardado.</small></div>`:""}`;
  $("#status").innerHTML = `<div class="st">
    <p class="lbl">Tu número</p><div class="num">${esc(p.numero)}</div><p class="who">${esc(p.nombre)}</p>

    <div class="mini">${(p.items||[]).map(it=>`<div>${it.cant}× ${esc(it.nombre)} (${esc(it.tam)})</div>`).join("")}${p.modo==="domicilio"?`<div style="margin-top:6px"><b>Total: ${money(p.total||0)}</b> · ${esc(p.pago)}</div>`:""}</div>
    ${p.modo==="domicilio" && p.pago==="Transferencia" && p.estado!=="entregado" ? (p.comprobante ? `<p class="note" style="margin-top:12px">🧾 Comprobante recibido ✓</p>` : `<div style="margin-top:14px">${transferInfo()}<label class="primary" for="compLater" style="margin-top:10px">🧾 Subir comprobante</label><input type="file" id="compLater" data-order="${p.id}" accept="image/*" hidden><p class="note" id="compMsg"></p></div>`) : ""}
    ${p.estado==="entregado"&&p.modo==="evento"?`<button class="primary" id="backBtn">Pedir otra bebida</button>`:`<button class="ghost" id="backBtn">Ver el menú</button>`}
    ${p.modo==="evento"&&p.estado!=="entregado"?`<p class="note" style="margin-top:12px">Si cierras la página, tu pedido sigue guardado en "Mis pedidos".</p>`:""}
  </div>`;
}

  if(t.id==="compFile" && t.files[0]){
    const lbl = document.querySelector('label[for="compFile"]'); lbl.textContent = "🧾 Procesando foto…";
    try{ compData = await compressImage(t.files[0]); lbl.textContent = "🧾 Comprobante listo ✓ (toca para cambiar)"; }
    catch{ compData = ""; lbl.textContent = "🧾 No se pudo leer la foto, intenta otra"; }
  }
  if(t.id==="compLater" && t.files[0]){
    const msg = $("#compMsg"); msg.textContent = "Subiendo…";
    try{ const d = await compressImage(t.files[0]); await updateDoc(doc(db,"pedidos",t.dataset.order), {comprobante:d}); msg.textContent = "¡Listo! Recibimos tu comprobante."; }
    catch{ msg.textContent = "No se pudo subir. Revisa tu señal e intenta de nuevo."; }
  }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && pendingBeep){ pendingBeep = false; setTimeout(()=>ring(), 400); } });

setModeUI(); renderChips(); renderMenu(); renderCart(); loadEvento();
loadMine(); mine.forEach(m=>track(m.id));
autoOpen = mine[0]?.id || null;

</script>
