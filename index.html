<style>
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}

/* Layout: app de una columna, carrito fijo abajo; mundo "galaxia neón" de la marca, solo tema oscuro por diseño */
:root{
  --bg:#140a2e; --panel:#21124a; --panel2:#2c1a5e; --line:#3f2a7a;
  --fg:#f3edff; --muted:#b9a9e6; --neon:#7dff3a; --pink:#ff4fb8; --gold:#ffc53d;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;padding-inline:16px;padding-block:0 120px;
  background-image:radial-gradient(1px 1px at 20% 30%,#fff8 50%,transparent),radial-gradient(1px 1px at 70% 10%,#fff6 50%,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff5 50%,transparent),radial-gradient(1px 1px at 40% 80%,#fff6 50%,transparent),radial-gradient(ellipse at top,#3a1d7a 0%,var(--bg) 60%);
  background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto}
header{padding-block:22px 10px;display:flex;align-items:center;gap:12px}
.logo{width:76px;height:76px;flex:none;filter:drop-shadow(0 0 12px #ff4fb866)}
h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;color:var(--neon);letter-spacing:.5px;text-shadow:0 0 14px #7dff3a55}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border-radius:14px;padding:4px;margin-block:12px;border:1px solid var(--line)}
.mode button{all:unset;cursor:pointer;text-align:center;padding:10px 6px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--pink);color:#fff}
.mode button:focus-visible,.chip:focus-visible,.card:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.note{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-top:8px;z-index:2}
.chip{all:unset;cursor:pointer;white-space:nowrap;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--neon);color:var(--neon)}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:22px 0 10px;color:var(--gold)}
.list{display:grid;gap:10px}
.card{all:unset;cursor:pointer;display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.card>div{min-width:0}
.cup{width:54px;height:62px;border-radius:6px 6px 14px 14px;position:relative;overflow:hidden;border:2px solid #ffffff30}
.cup::after{content:"";position:absolute;inset:auto 8px 6px;height:18px;border-radius:50%;background:#ffffff22}
.cup i{position:absolute;top:-6px;left:60%;width:4px;height:30px;background:var(--gold);transform:rotate(12deg);border-radius:2px}
.name{font-weight:800;font-size:16px}
.desc{color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:3px}
.price{font-family:var(--display);font-size:20px;color:var(--neon)}
.cart{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);z-index:5}
.cart button,.primary{all:unset;cursor:pointer;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;width:100%;max-width:560px;margin:0 auto;background:var(--neon);color:#1a0b3a;font-weight:800;font-size:16px;padding:15px 18px;border-radius:14px}
.primary{justify-content:center;text-align:center}
.primary[disabled]{opacity:.45;cursor:not-allowed}
.sheetbg{position:fixed;inset:0;background:#0009;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--pink)}
.sheet h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--neon)}
.grp{margin-top:16px}
.grp b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0}
.opt span{display:block;padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;font-size:14px;cursor:pointer}
.opt input:checked+span{border-color:var(--neon);background:#7dff3a1a;color:var(--neon)}
.opt input:focus-visible+span{outline:2px solid var(--neon)}
label.f{display:block;margin-top:12px;font-weight:700;font-size:13px}
input.t,textarea.t{width:100%;margin-top:5px;background:var(--bg);border:1.5px solid var(--line);color:var(--fg);border-radius:10px;padding:11px;font:inherit}
textarea.t{min-height:60px;resize:vertical}
.qty{display:flex;align-items:center;gap:14px;margin-top:18px}
.qty button{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;background:var(--panel2);text-align:center;font-size:22px;line-height:38px;font-weight:800}
.qty output{font-weight:800;font-size:18px;min-width:20px;text-align:center}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.row div{min-width:0}
.row small{color:var(--muted);display:block}
.rm{all:unset;cursor:pointer;color:var(--pink);font-size:12.5px;font-weight:700}
.total{display:flex;justify-content:space-between;font-family:var(--display);font-size:22px;margin:12px 0 4px}
.total span:last-child{color:var(--neon);font-variant-numeric:tabular-nums}
.close{all:unset;cursor:pointer;float:right;color:var(--muted);font-weight:800;padding:4px 8px}
.err{color:var(--pink);font-size:13px;font-weight:700;margin-top:10px}
.ok{background:#7dff3a1a;border:1px solid var(--neon);border-radius:12px;padding:12px;font-size:13.5px;margin-top:12px}
.ok a{color:var(--neon);font-weight:800}
.badge{display:inline-block;font-size:11px;font-weight:800;background:var(--pink);color:#fff;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.primary[disabled]{opacity:.5}
.ghost{all:unset;cursor:pointer;box-sizing:border-box;display:block;width:100%;text-align:center;padding:13px;border-radius:14px;border:1.5px solid var(--line);color:var(--muted);font-weight:800;margin-top:18px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px 18px;text-align:center;margin-top:8px}
.st .primary{margin-top:18px}
.lbl{margin:0;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.num{font-family:var(--display);font-size:72px;line-height:1;color:var(--neon);text-shadow:0 0 22px #7dff3a66;font-variant-numeric:tabular-nums}
.who{margin:4px 0 16px;font-weight:800;font-size:18px}
.wait{font-size:16px;font-weight:700;line-height:1.5;margin:0 0 16px}
.wait small{color:var(--muted);font-weight:600}
.ready{background:var(--neon);color:#1a0b3a;font-family:var(--display);font-size:28px;border-radius:18px;padding:18px 12px;margin-bottom:16px;animation:pulse 1.2s ease-in-out infinite}
.ready span{display:block;font-family:var(--body);font-size:15px;font-weight:800;margin-top:4px}
.ready.done{background:var(--pink);color:#fff;animation:none}
@keyframes pulse{50%{transform:scale(1.03);box-shadow:0 0 30px #7dff3a88}}
@media (prefers-reduced-motion:reduce){.ready{animation:none}}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps li{font-size:11.5px;font-weight:800;color:var(--muted);padding-top:10px;border-top:4px solid var(--line)}
.steps li.pas{border-color:var(--pink);color:var(--fg)}
.steps li.now{border-color:var(--neon);color:var(--neon)}
.xbox{background:rgba(255,40,60,.12);border:2px solid #ff3b4e;color:#ff6b78;border-radius:14px;padding:12px 14px;margin:12px 0;font-weight:800;font-size:15px;line-height:1.45;text-align:left}
.xbox b{color:#ff3b4e}
.price.xtra{color:#ff6b78;font-size:18px;text-align:right;line-height:1.1}.price.xtra small{display:block;font-size:11px;font-weight:800}
.ghint{display:block;color:var(--muted);font-size:12.5px;font-weight:700;margin:-2px 0 6px}
.steps.s5{grid-template-columns:repeat(5,1fr)}.steps.s5 li{font-size:10.5px}
.rider{background:var(--panel2,#2c1a5e);border-radius:16px;padding:14px;margin-bottom:14px;font-weight:800;font-size:16px}
.rider small{display:block;color:var(--muted);font-weight:700;font-size:13px;margin-top:4px}
#cmap{height:260px;border-radius:16px;overflow:hidden;margin:0 0 14px;background:#1b1240}
.cpin{font-size:32px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
#riderEta{font-size:15px;margin:-4px 0 14px;font-weight:800}#riderEta b{color:var(--neon);font-size:20px}
.mini{margin-top:16px;color:var(--muted);font-size:13.5px;line-height:1.6}
.mrow{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.mrow:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.mnum{font-family:var(--display);font-size:26px;color:var(--neon);font-variant-numeric:tabular-nums}
.mtxt{min-width:0}.mtxt b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mtxt small{color:var(--muted);font-size:12px}
.pill{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.preparando{color:var(--gold)}.pill.lista{background:var(--neon);color:#1a0b3a}.pill.entregado{opacity:.6}
#mine{margin-bottom:6px}
body.flash{animation:fl 1s steps(2) 8}
@keyframes fl{50%{background:#3b1468}}
@media (prefers-reduced-motion:reduce){body.flash{animation:none}}
.aviso{background:#ffc53d1f;border:1.5px solid var(--gold);border-radius:14px;padding:12px 14px;text-align:left;font-size:13.5px;line-height:1.45;margin:0 0 16px}
.aviso b{display:block;color:var(--gold);font-size:14.5px;margin-bottom:4px}
.aviso small{display:block;margin-top:6px;color:var(--muted)}
.ph{width:72px;height:90px;object-fit:cover;border-radius:12px;display:block}
.phbig{display:block;width:150px;height:188px;object-fit:cover;border-radius:16px;margin:0 auto 12px;box-shadow:0 8px 30px #0008}
.brands{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 8px}
.brand{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;border-radius:14px;border:1.5px solid var(--line);font-weight:800;font-size:14px;background:var(--panel)}
.brand img{width:34px;height:34px}
.brand[aria-pressed="true"]{border-color:var(--neon);color:var(--neon);background:var(--panel2)}
.brand:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
body[data-marca="beer"] h1{color:#ffd23f;text-shadow:0 0 14px #ffd23f55}
.card.agot{opacity:.5}
.price.agt{font-family:var(--body);font-size:13px;font-weight:800;color:var(--pink)}
.opt.off span{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.closed{color:var(--pink);font-weight:800}
.vaso{margin-top:14px;padding:14px;border-radius:14px;background:#ffd23f;color:#1a0b3a;border:3px solid #ff7a00;box-shadow:0 0 0 4px rgba(255,122,0,.25)}
.vaso b{display:block;font-size:17px;line-height:1.25}.vaso small{display:block;margin-top:4px;font-size:13.5px;font-weight:600}
.vaso.big{animation:vpulse 1.4s ease-in-out infinite}.vaso.big b{font-size:20px}
@keyframes vpulse{0%,100%{box-shadow:0 0 0 4px rgba(255,122,0,.25)}50%{box-shadow:0 0 0 10px rgba(255,122,0,.45)}}
.vaso label{display:flex;gap:10px;align-items:center;margin-top:10px;font-weight:800;font-size:15px;cursor:pointer}.vaso input{width:24px;height:24px;flex:none;accent-color:#1a0b3a}
@media (prefers-reduced-motion:reduce){.vaso.big{animation:none}}
.sa{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px;border-radius:12px;border:1.5px solid var(--line);cursor:pointer}
.sa input{width:24px;height:24px;accent-color:var(--neon);flex:none}
.sa b{display:block;font-size:15px}.sa small{color:var(--muted);font-size:12.5px}
.sa:has(input:checked){border-color:var(--neon);background:#7dff3a14}
.ready.cancel{background:var(--panel2);color:var(--pink);border:2px solid var(--pink);animation:none}
.pill.cancelado{color:var(--pink);text-decoration:line-through}
.cupbox{display:flex;gap:8px;margin-top:10px;align-items:center}
.cupbox .t{margin-top:0;flex:1;min-width:0;text-transform:uppercase}
.row.cupok{color:var(--neon)}
.row.cupok small{color:var(--muted)}
.cupban{display:block;margin-top:8px;background:#7dff3a1a;border:1.5px solid var(--neon);color:var(--fg);border-radius:12px;padding:8px 10px}
.old{opacity:.55;font-size:.8em;font-weight:600}
.wafab{border:0;cursor:pointer;font-family:inherit;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:8px;background:#25d366;color:#0b3d1e;font-weight:800;font-size:14px;text-decoration:none;padding:11px 15px;border-radius:999px;box-shadow:0 6px 20px #0008}
.wafab:focus-visible,.wabtn:focus-visible{outline:2px solid var(--neon);outline-offset:3px}
.wabtn{border:0;cursor:pointer;font-family:inherit;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:10px;background:#25d366;color:#0b3d1e;font-weight:800;font-size:15px;text-decoration:none;padding:13px 16px;border-radius:14px}
.contra{margin-top:24px;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:16px;text-align:center}
.contra b{display:block;font-family:var(--display);font-weight:400;font-size:22px;color:var(--neon)}
.contra p{color:var(--muted);margin:6px 0 12px}
.waopts{display:grid;gap:8px;margin-top:14px}
.waopt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--panel2);border:1.5px solid var(--line);color:var(--fg);text-decoration:none;font-weight:800;font-size:15px}
.waopt:active,.waopt:hover{border-color:#25d366}
.waopt .ic{font-size:20px}.waopt span:nth-child(2){flex:1}.waopt .go2{color:#25d366;font-size:24px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <img class="logo" id="brandLogo" alt="Logo" src="logo.png">
    <div><h1 id="brandName">Nano's Fizz</h1><p class="sub" id="evName">Pide desde tu cel. Nosotros te avisamos.</p></div>
  </header>
  <div id="menuWrap">

</div>

<div class="cart" id="cartBar" hidden><button id="openCart"><span id="cartCount">0 bebidas</span><span>Ver pedido · <span id="cartTotal">$0</span></span></button></div>
<button class="wafab" id="waFab" data-wa hidden><svg viewBox="0 0 24 24" aria-hidden="true" width="22" height="22"><path fill="currentColor" d="M12 3C6.9 3 3 6.6 3 11c0 2.3 1.1 4.4 2.9 5.9L5 21l4.3-2.1c.9.2 1.8.3 2.7.3 5.1 0 9-3.6 9-8.1S17.1 3 12 3zm-4 9.2a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4zm4 0a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4zm4 0a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4z"/></svg><span id="waTxt">WhatsApp</span></button>
<div class="sheetbg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="menu.js?v=34"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, doc, getDoc, updateDoc, setDoc, increment, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDP3ZypMhSahfx-e1KEsSh6rsy4IIJakiU",
  authDomain: "nanos-fizz.firebaseapp.com",
  projectId: "nanos-fizz",
  storageBucket: "nanos-fizz.firebasestorage.app",
  messagingSenderId: "567480397409",
  appId: "1:567480397409:web:a4c5e7fb65ba931ae00420"
};
const db = getFirestore(initializeApp(firebaseConfig));
const EXTRA_LITRO = 30;

const { MARCAS, CATS: ALLCATS, ITEMS, EXTRAS, FOTOS } = window.NF_MENU;
let marca = "fizz", agotados = {}, tienda = null, alcoholDom = false;
const curCats = () => ALLCATS.filter(c=>(c.marca===marca || c.todas) && !(c.soloDom && mode==="evento")).sort((a,b)=>(a.todas?1:0)-(b.todas?1:0));
const marcasEvento = () => !E ? (alcoholDom ? ["fizz","beer"] : ["fizz"]) : (evento && evento.marca==="ambos") ? ["fizz","beer"] : [(evento && evento.marca) || "fizz"];
const isAgotado = (id, sabor) => !!agotados[sabor ? id+"|"+sabor : id];
// Envío: $20 con 1 bebida; gratis desde 2 bebidas
function envioBase(){ const n = cart.reduce((a,l)=>a+l.qty,0); return n>=2 ? 0 : 20; }
// ===== Cupones =====
let cupones = {}, cuponAplicado = "", cuponMsg = "";
const cuponDe = code => { const c = cupones[String(code||"").toUpperCase()]; return c && c.activo ? c : null; };
function envio(){ const c = cuponDe(cuponAplicado); return c && c.tipo==="envio" ? 0 : envioBase(); }
function descuento(){
  const c = cuponDe(cuponAplicado); if(!c) return 0;
  if(c.tipo==="pct") return Math.round(cartTotal() * Math.min(100, c.valor||0) / 100);
  if(c.tipo==="monto") return Math.min(cartTotal(), c.valor||0);
  if(c.tipo==="envio") return 0;
  return 0;
}
function pctCupon(){ const c = cuponDe(cuponAplicado); return c && c.tipo==="pct" ? Math.min(100, c.valor||0) : 0; }
function precioHTML(v){ const pc = pctCupon(); return pc ? `<s class="old">${money(v)}</s> ${money(Math.round(v*(100-pc)/100))}` : money(v); }
function totalFinal(){ return Math.max(0, cartTotal() + envio() - descuento()); }
// Datos para transferencia (se muestran al cliente si están llenos)
// WhatsApp: número de pedidos a domicilio y número para contrataciones de eventos (con 52 al inicio)
const WA_PEDIDOS = "525629842239";
const WA_EVENTOS = "525629842239";
const WA_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true" width="22" height="22"><path fill="currentColor" d="M12 3C6.9 3 3 6.6 3 11c0 2.3 1.1 4.4 2.9 5.9L5 21l4.3-2.1c.9.2 1.8.3 2.7.3 5.1 0 9-3.6 9-8.1S17.1 3 12 3zm-4 9.2a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4zm4 0a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4zm4 0a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4z"/></svg>`;
const waLink = (num, txt) => `https://wa.me/${num}?text=${encodeURIComponent(txt)}`;
function opcionesWA(){

const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
function mxNow(){
  const f = new Intl.DateTimeFormat("en-US",{timeZone:"America/Mexico_City",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
  const g = k => f.find(x=>x.type===k).value;
  return { d: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(g("weekday")), m: (+g("hour"))*60 + (+g("minute")) };
}
const toMin = h => { const [a,b] = String(h||"0:0").split(":"); return (+a)*60 + (+b||0); };
function turnosDe(x){ if(!x || !x.on) return []; return (x.turnos && x.turnos.length) ? x.turnos : [{abre:x.abre, cierra:x.cierra}]; }
const fmt12 = h => { let [a,b] = String(h).split(":").map(Number); const pm = a>=12; a = a%12 || 12; return a + (b?":"+String(b).padStart(2,"0"):"") + (pm?" pm":" am"); };
function tiendaAbierta(){
  if(!tienda || tienda.modo==="abierto") return {abierta:true};
  if(tienda.modo==="cerrado") return {abierta:false, msg: tienda.aviso || "Por hoy no estamos recibiendo pedidos."};
  const dias = tienda.dias || {}, now = mxNow();
  for(const t of turnosDe(dias[now.d])){
    const a = toMin(t.abre), z = toMin(t.cierra);
    if(z > a ? (now.m >= a && now.m < z) : (now.m >= a)) return {abierta:true};
  }
  for(const t of turnosDe(dias[(now.d+6)%7])){
    const a = toMin(t.abre), z = toMin(t.cierra);
    if(z <= a && now.m < z) return {abierta:true};
  }
  for(let k=0;k<8;k++){
    const d = (now.d+k)%7;
    const next = turnosDe(dias[d]).map(t=>t.abre).filter(h=>k>0 || toMin(h) > now.m).sort((x,y)=>toMin(x)-toMin(y))[0];
    if(next) return {abierta:false, msg: `Abrimos ${k===0?"hoy":k===1?"mañana":"el "+DIAS[d]} a las ${fmt12(next)}.`};
  }
  return {abierta:false, msg:"Por ahora no tenemos horario disponible."};
}

// ===== Timbre fuerte: <audio> con WAV generado (suena aunque el iPhone esté en silencio) =====
function makeChime(){
  const sr = 22050, notes = [988, 1319, 1568, 1319, 1568, 2093], dur = 0.22, gap = 0.04, reps = 3, pause = 0.35;
  const one = notes.length*(dur+gap), total = reps*one + (reps-1)*pause;
  const n = Math.floor(total*sr), data = new Int16Array(n);
  for(let r=0;r<reps;r++){
    const off = r*(one+pause);
    notes.forEach((f,k)=>{
      const st = Math.floor((off + k*(dur+gap))*sr), len = Math.floor(dur*sr);
      for(let i=0;i<len && st+i<n;i++){
        const t = i/sr, env = Math.min(1, i/200) * Math.exp(-3*t);
        const v = Math.sin(2*Math.PI*f*t) + 0.5*Math.sin(2*Math.PI*2*f*t) + 0.25*Math.sign(Math.sin(2*Math.PI*f*t));
        data[st+i] = Math.max(-32767, Math.min(32767, v*env*20000));
      }
    });
  }
  const buf = new ArrayBuffer(44 + n*2), dv = new DataView(buf);
  const w = (o,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(o+i, s.charCodeAt(i)); };
  w(0,"RIFF"); dv.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); dv.setUint32(16,16,true);
  dv.setUint16(20,1,true); dv.setUint16(22,1,true); dv.setUint32(24,sr,true); dv.setUint32(28,sr*2,true);
  dv.setUint16(32,2,true); dv.setUint16(34,16,true); w(36,"data"); dv.setUint32(40,n*2,true);
  new Int16Array(buf,44).set(data);
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
}
const chime = new Audio(makeChime()); chime.preload = "auto";
let chimeReady = false;
try{ if(navigator.audioSession) navigator.audioSession.type = "playback"; }catch{}
// Llamar dentro de un toque del usuario para que el navegador permita sonar después
function unlockSound(){
  if(chimeReady) return;
  try{
    chime.muted = true;
    const p = chime.play();
    const done = ()=>{ chime.pause(); chime.currentTime = 0; chime.muted = false; chimeReady = true; };
    p && p.then ? p.then(done).catch(()=>{ chime.muted = false; }) : done();
  }catch{}
}
function ring(txt){
  try{ chime.currentTime = 0; chime.muted = false; chime.volume = 1; chime.play().catch(()=>{}); }catch{}
  try{ navigator.vibrate && navigator.vibrate([400,150,400,150,700]); }catch{}
  flash(txt);
}
let flashTimer = null;
function flash(txt){
  clearInterval(flashTimer); let k = 0; const t0 = window.__t0 || (window.__t0 = document.title);
  document.body.classList.add("flash");
  flashTimer = setInterval(()=>{
    document.title = (k++%2) ? t0 : (txt||"🔔 ¡Lista!");
    if(k>16){ clearInterval(flashTimer); document.title = t0; document.body.classList.remove("flash"); }
  }, 500);
}

function compressImage(file){
  return new Promise((ok,bad)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      let max = 1000, q = 0.7, out = "";
      for(let k=0;k<4;k++){
        const sc = Math.min(1, max/Math.max(img.width,img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        out = c.toDataURL("image/jpeg", q);
        if(out.length < 600000) break; max *= 0.8; q -= 0.1;
      }
      URL.revokeObjectURL(url); out.length < 850000 ? ok(out) : bad();
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); bad(); };
    img.src = url;
  });
}
function askLocation(btn){
  if(!navigator.geolocation){ $("#geoMsg").textContent = "Tu navegador no permite compartir ubicación. Escribe bien la dirección."; return; }
  btn.textContent = "📍 Buscando tu ubicación…";
  navigator.geolocation.getCurrentPosition(pos=>{
    const prec = Math.round(pos.coords.accuracy||0);
    if(prec > 300){
      ubic = null;
      btn.textContent = "📍 Intentar de nuevo";
      $("#geoMsg").textContent = `Tu ubicación salió muy imprecisa (±${prec>=1000?Math.round(prec/1000)+" km":prec+" m"}), así que no la mandamos. Activa el GPS / Ubicación de tu celular y vuelve a intentar, o asegúrate de que tu dirección esté bien escrita.`;
      return;
    }
    ubic = {lat:+pos.coords.latitude.toFixed(6), lng:+pos.coords.longitude.toFixed(6), prec};
    btn.textContent = "📍 Ubicación agregada ✓ (toca para actualizar)";
    $("#geoMsg").textContent = `Precisión aprox. ${ubic.prec} m`;
  }, ()=>{
    btn.textContent = "📍 Compartir mi ubicación";
    $("#geoMsg").textContent = "No se pudo obtener. Revisa que el navegador tenga permiso de ubicación, o escribe bien la dirección.";
  }, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
}

  try{

const PASOS = {
  evento:   [["nuevo","Recibido"],["preparando","Preparando"],["lista","¡Lista!"],["entregado","Entregada"]],
  domicilio:[["nuevo","Recibido"],["preparando","Preparando"],["asignado","Repartidor"],["camino","En camino"],["llego","Llegó"]]
};
const ESTADO_TXT = {nuevo:"En fila", preparando:"Preparando", lista:"¡Lista!", entregado:"Entregada", cancelado:"Cancelado"};
const VIDA = 14*3600*1000; // los pedidos se guardan en el celular 14 horas

// ===== Mis pedidos (se guardan en este celular) =====
let mine = [], data = {}, watchers = {}, viewing = null, autoOpen = null;
function loadMine(){
  try{ mine = JSON.parse(store.get("nf_mis") || "[]"); }catch{ mine = []; }
  const old = store.get("nf_pedido"); // pedido de la versión anterior
  if(old && !mine.some(m=>m.id===old)) mine.unshift({id:old, t:Date.now()});
  store.del("nf_pedido");
  mine = mine.filter(m=>Date.now()-m.t < VIDA).slice(0,10);
  saveMine();
}
function saveMine(){ store.set("nf_mis", JSON.stringify(mine.map(m=>({id:m.id,t:m.t})))); }
function activeEvento(){ return mine.map(m=>data[m.id]).find(p=>p && p.modo==="evento" && p.evento===E && !(p.total>0) && p.estado!=="entregado" && p.estado!=="cancelado"); }

function track(id){
  if(watchers[id]) return;
  watchers[id] = onSnapshot(doc(db,"pedidos",id), snap=>{
    if(!snap.exists()){
      watchers[id](); delete watchers[id]; delete data[id];
      mine = mine.filter(m=>m.id!==id); saveMine();
      if(viewing===id) backToMenu();
      renderMine(); return;
    }
    const prev = data[id], p = {id, ...snap.data()};
    data[id] = p;
    if(prev && prev.estado!=="lista" && p.estado==="lista"){ ring(); if(document.visibilityState!=="visible") pendingBeep = true; }
    if(prev && p.rep && p.rep.fase==="llego" && (!prev.rep || prev.rep.fase!=="llego")){ ring("🚪 ¡Llegó tu pedido!"); if(document.visibilityState!=="visible") pendingBeep = true; }
    if(p.estado==="entregado" || p.estado==="cancelado"){ watchers[id](); delete watchers[id]; }
    if(viewing===id) renderStatus(p);
    else if(autoOpen===id && viewing===null && p.estado!=="entregado") showStatus(id);
    if(autoOpen===id) autoOpen = null;
    renderMine();
  }, ()=>{ delete watchers[id]; if(viewing===id) $("#status").innerHTML = `<div class="st"><p class="err">Se perdió la conexión. Revisa tu señal y vuelve a abrir la página.</p><button class="ghost" id="backBtn">Volver al menú</button></div>`; });
}

function renderMine(){ setTimeout(renderWA, 0);
  const list = mine.map(m=>data[m.id]).filter(p=>p && (E ? p.evento===E : p.modo==="domicilio"));
  const box = $("#mine");
  if(!list.length){ box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = `<h2 style="margin-top:4px">Mis pedidos</h2><div class="list">${list.map(p=>`
    <button class="mrow" data-mine="${p.id}">
      <span class="mnum">${esc(p.numero)}</span>
      <span class="mtxt"><b>${(p.items||[]).map(it=>`${it.cant>1?it.cant+"× ":""}${esc(it.nombre)}`).join(", ")}</b><small>${p.modo==="domicilio"?"A domicilio":"En el evento"}</small></span>
      <span class="pill ${p.estado}">${p.modo==="domicilio"&&p.estado==="lista"?"En camino":ESTADO_TXT[p.estado]||""}</span>

}

    ${p.modo==="evento" && p.total>0 && p.estado!=="entregado" && p.estado!=="cancelado" ? `<div class="xbox">⚠️ <b>Recuerda que este producto tiene costo extra</b> y no está incluido en el evento. Paga <b>${money(p.total)}</b> en la barra al recibirlo.</div>` : ""}
    ${p.estado==="cancelado"?"":`<ol class="steps${pasos.length===5?" s5":""}">`+pasos.map((s,k)=>`<li class="${k<idx?"pas":k===idx?"now":""}">${s[1]}</li>`).join("")+`</ol>`}
    <div class="mini">${(p.items||[]).map(it=>`<div>${it.cant}× ${esc(it.nombre)}${it.tam?` (${esc(it.tam)})`:""}</div>`).join("")}${p.modo==="domicilio"?`<div style="margin-top:6px"><b>Total: ${money(p.total||0)}</b> · ${esc(p.pago)}</div>`:""}</div>
    ${p.modo==="domicilio" && p.pago==="Tarjeta (liga de pago)" && p.estado==="nuevo" ? `<div style="margin-top:12px;padding:14px;border-radius:14px;background:rgba(0,158,227,.15);border:1px solid #009ee3;text-align:left">
      <b style="font-size:16px">💳 ¡Ya casi! Te enviamos tu liga de pago</b>
      <p class="note" style="margin-top:6px">En unos minutos te llega por WhatsApp${p.tel?` al <b>${esc(p.tel)}</b>`:""} una liga segura para pagar <b>${money(p.total||0)}</b> con tu tarjeta desde el celular. En cuanto se refleje tu pago, empezamos a preparar tus bebidas 🍹</p>
      <p class="note" style="margin-top:6px">¿No te ha llegado? Toca el botón de WhatsApp y elige <b>"Mándenme mi liga"</b> 💜</p></div>` : ""}
    ${p.modo==="domicilio" && p.pago==="Transferencia" && p.estado!=="entregado" ? (p.comprobante ? `<p class="note" style="margin-top:12px">🧾 Comprobante recibido ✓</p>` : `<div style="margin-top:14px">${transferInfo()}<label class="primary" for="compLater" style="margin-top:10px">🧾 Subir comprobante</label><input type="file" id="compLater" data-order="${p.id}" accept="image/*" hidden><p class="note" id="compMsg"></p></div>`) : ""}
    ${(p.estado==="entregado"||p.estado==="cancelado")&&p.modo==="evento"?`<button class="primary" id="backBtn">Pedir otra bebida</button>`:`<button class="ghost" id="backBtn">Ver el menú</button>`}
    ${p.modo==="evento" && (p.estado==="lista"||p.estado==="entregado") ? `<button class="wabtn" style="margin-top:14px;width:100%" data-wa>${WA_ICON}<span>¿Te gustó? Contrátanos para tu evento</span></button>` : ""}
    ${p.modo==="domicilio" && p.estado!=="entregado" ? `<button class="wabtn" style="margin-top:14px;width:100%" data-wa>${WA_ICON}<span>Escríbenos sobre tu pedido</span></button>` : ""}
    ${p.modo==="evento"&&p.estado!=="entregado"?`<p class="note" style="margin-top:12px">Si cierras la página, tu pedido sigue guardado en "Mis pedidos".</p>`:""}
  </div>`;  trackRider(p);
}
// ===== Repartidor en vivo (mapa para el cliente) =====
let cmap = null, cmapEl = null, riderMk = null, homeMk = null, trkUnsub = null, trkId = null, trkData = null;
const fmtD = m => m>=1000 ? (Math.round(m/100)/10)+" km" : Math.max(10,Math.round(m/10)*10)+" m";
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(loadLeaflet.p) return loadLeaflet.p;
  return loadLeaflet.p = new Promise((res,rej)=>{
    const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(l);
    const sc = document.createElement("script"); sc.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"; sc.onload = res; sc.onerror = ()=>{ loadLeaflet.p = null; rej(); }; document.head.appendChild(sc);
  });
}
function trackRider(p){
  const on = p.modo==="domicilio" && p.rep && p.rep.fase==="camino" && p.estado!=="entregado" && p.estado!=="cancelado";
  if(!on){ if(trkUnsub){ trkUnsub(); trkUnsub = null; } trkId = null; trkData = null; return; }
  const w = $("#cmapWrap"); if(!w) return;
  if(!cmapEl){ cmapEl = document.createElement("div"); cmapEl.id = "cmap"; }
  w.appendChild(cmapEl);
  loadLeaflet().then(()=>{
    if(!cmap){ cmap = L.map(cmapEl,{zoomControl:false}).setView([19.43,-99.13],14); L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(cmap); }
    setTimeout(()=>{ cmap.invalidateSize(); pintarRider(); }, 60);
  }).catch(()=>{ cmapEl.style.display = "none"; });
  if(trkId!==p.id){ trkUnsub && trkUnsub(); trkId = p.id; trkData = null; trkUnsub = onSnapshot(doc(db,"rastreo",p.id), s=>{ trkData = s.exists() ? s.data() : null; pintarRider(); }, ()=>{}); }
  else pintarRider();
}
function pintarRider(){
  const el = $("#riderEta");
  if(!trkData){ if(el) el.textContent = "Esperando la ubicación del repartidor…"; return; }
  if(el) el.innerHTML = trkData.min ? `Llega en aprox. <b>${trkData.min} min</b>${trkData.m?` · a ${fmtD(trkData.m)}`:""}` : "Tu repartidor va en camino";
  if(!window.L || !cmap) return;
  const rp = [trkData.lat, trkData.lng];
  if(riderMk) riderMk.setLatLng(rp); else riderMk = L.marker(rp,{icon:L.divIcon({className:"",html:'<div class="cpin">🛵</div>',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(cmap);
  const home = trkData.dlat ? [trkData.dlat, trkData.dlng] : null;
  if(home){ if(homeMk) homeMk.setLatLng(home); else homeMk = L.marker(home,{icon:L.divIcon({className:"",html:'<div class="cpin">🏠</div>',iconSize:[34,34],iconAnchor:[17,30]})}).addTo(cmap);
    cmap.fitBounds(L.latLngBounds([rp,home]).pad(.35),{maxZoom:17}); }
  else cmap.setView(rp,16);
}
function backToMenu(){
  viewing = null;
  $("#status").hidden = true; $("#menuWrap").hidden = false; renderCart(); scrollTo(0,0);
}
function closedSheet(){
  openSheet(`<button class="close" data-close>Cerrar ✕</button><h3>${sinEvento?"Aún no hay evento":evento===null?"Un momento…":"Este evento ya cerró"}</h3>
    <p class="desc" style="font-size:14.5px;margin-top:8px">${sinEvento?"Esta barra todavía no tiene un evento activo. Pregunta en la barra.":evento===null?"Estamos cargando el evento, intenta de nuevo en unos segundos.":"Ya no se reciben pedidos para este evento. ¡Gracias por venir!"}</p>`);
}
function lockSheet(p){
  openSheet(`<button class="close" data-close>Cerrar ✕</button><h3>Ya tienes una bebida pedida</h3>
    <p class="desc" style="font-size:14.5px;margin-top:8px">En el evento es <b>una bebida a la vez por celular</b>. Si alguien de tu mesa no trae celular, puede pedir directo en la barra. Tu pedido <b>número ${esc(p.numero)}</b> está <b>${ESTADO_TXT[p.estado]}</b>. Cuando termines tu primera bebida podrás pedir otra.</p>
    <div style="margin-top:18px"><button class="primary" data-mine="${p.id}">Ver mi pedido</button></div>`);
}

document.addEventListener("click", e=>{
  if(e.target.id==="sheetBg"){ closeSheet(); return; }
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.wa!==undefined){ openWA(); return; }
  if(t.dataset.marca) setMarca(t.dataset.marca);
  else if(t.dataset.mayor){ store.set("nf_18","1"); closeSheet(); setMarca(t.dataset.mayor); }
  else if(t.dataset.mine) showStatus(t.dataset.mine);
  else if(t.id==="backBtn") backToMenu();
  else if(t.dataset.c){ cat=t.dataset.c; renderChips(); renderMenu(); }
  else if(t.dataset.i) openItem(t.dataset.i);
  else if(t.dataset.q){ const q=$("#q"); q.textContent=Math.min(10,Math.max(1,+q.textContent+ +t.dataset.q)); }
  else if(t.dataset.add) addItem(t.dataset.add);
  else if(t.dataset.close!==undefined) closeSheet();
  else if(t.dataset.rm){ cart.splice(+t.dataset.rm,1); cart.length?openCart():(closeSheet(),renderCart()); }
  else if(t.id==="openCart" || t.id==="openCart2") openCart();
  else if(t.id==="geoBtn") askLocation(t);
  else if(t.dataset.cupok!==undefined){
    const code = ($("#cupIn")?.value||"").trim().toUpperCase();
    if(cuponDe(code)){ cuponAplicado = code; store.set("nf_cupon", code); cuponMsg = ""; setModeUI(); renderMenu(); }
    else cuponMsg = code ? "Ese código no es válido o ya no está activo." : "Escribe tu código.";
    renderCart(); openCart();
  }
  else if(t.dataset.cupoff!==undefined){ cuponAplicado = ""; store.del("nf_cupon"); cuponMsg = ""; setModeUI(); renderMenu(); renderCart(); openCart(); }
  else if(t.dataset.copy){ const v = t.dataset.copy; (navigator.clipboard?.writeText(v) || Promise.reject()).then(()=>{ t.textContent = "Copiada ✓"; }).catch(()=>{ t.textContent = "Mantén presionado el número para copiar"; }); }
  else if(t.id==="sendBtn") send();
});
document.addEventListener("input", e=>{ const k = {nombre:"nf_nombre",tel:"nf_tel",lugar:"nf_dir",ref:"nf_ref"}[e.target.id]; if(k) store.set(k, e.target.value); });
document.addEventListener("change", async e=>{
  const t = e.target;
  if(t.name==="pago"){
    const box = $("#transfBox"); if(box) box.hidden = t.value!=="Transferencia";
    const n = $("#pagoNote"); if(n) n.textContent = t.value==="Transferencia" ? "Transfiere el total y sube tu comprobante. Preparamos tu pedido en cuanto confirmamos el pago."
      : t.value==="Tarjeta (liga de pago)" ? "Te mandamos por WhatsApp una liga segura para pagar con tu tarjeta desde el celular. En cuanto se refleje tu pago, preparamos tu pedido 💜" : "Pagas en efectivo al recibir tu pedido.";
  }
  if(t.id==="compFile" && t.files[0]){
    const lbl = document.querySelector('label[for="compFile"]'); lbl.textContent = "🧾 Procesando foto…";
    try{ compData = await compressImage(t.files[0]); lbl.textContent = "🧾 Comprobante listo ✓ (toca para cambiar)"; }
    catch{ compData = ""; lbl.textContent = "🧾 No se pudo leer la foto, intenta otra"; }
  }
  if(t.id==="compLater" && t.files[0]){
    const msg = $("#compMsg"); msg.textContent = "Subiendo…";
    try{ const d = await compressImage(t.files[0]); await updateDoc(doc(db,"pedidos",t.dataset.order), {comprobante:d}); msg.textContent = "¡Listo! Recibimos tu comprobante."; }
    catch{ msg.textContent = "No se pudo subir. Revisa tu señal e intenta de nuevo."; }
  }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && pendingBeep){ pendingBeep = false; setTimeout(()=>ring(), 400); } });

setModeUI(); renderBrand(); renderChips(); renderMenu(); renderCart(); loadEvento(); listenConfig(); stat("visita");
if("serviceWorker" in navigator && !E) navigator.serviceWorker.register("sw.js").catch(()=>{});
loadMine(); mine.forEach(m=>track(m.id));
autoOpen = mine[0]?.id || null;

</script>
<script>
/* Auto-actualización: si en GitHub hay una versión nueva, la página se recarga sola (sin interrumpir un pedido en curso) */
(function(){
  var V=(document.querySelector('meta[name="app-ver"]')||{}).content||"";
  function chk(){
    if(document.visibilityState!=="visible") return;
    fetch(location.pathname+"?nc="+Date.now(),{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){
      var m=t.match(/name="app-ver" content="([^"]+)"/); if(!m||m[1]===V) return;
      try{ if(sessionStorage.getItem("nf_rl_"+m[1])) return; }catch(e){}
      if(window.__ocupado && window.__ocupado()){ setTimeout(chk,60000); return; }
      try{ sessionStorage.setItem("nf_rl_"+m[1],"1"); }catch(e){}
      var u=new URL(location.href); u.searchParams.set("v",m[1]); location.replace(u.toString());
    }).catch(function(){});
  }
  document.addEventListener("visibilitychange",chk); setTimeout(chk,3000); setInterval(chk,300000);
})();
</script>
